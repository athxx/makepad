[package]
name = "viso-id"
version = "1.0.0"
authors = ["Viso <support@viso.im>"]
edition = "2024"
description = "Viso id generator"
license = "LGPL-3.0"
homepage = "https://github.com/visokit/viso/"
repository = "https://github.com/visokit/viso/"
metadata.makepad-auto-version = "Fjf_rJTOgvZXwyU7Yb-CZMF6Hmo="

[dependencies]
viso-id-derive = { path = "derive", version = "1.0.0" }

serde = { version = "1", optional = true, features = ["derive"] }

[features]
default = []
## Enables certain public-facing types to derive serde serialization traits.
serde = ["dep:serde"]
