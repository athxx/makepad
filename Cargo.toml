workspace.exclude = [
    # Arcade game sandbox. Kept in tree but excluded: its libs/game/* path
    # deps collide with libs/sim/libs/sim/math (same package names
    # makepad-game-sim / makepad-game-math). Build it standalone.
    "examples/app_arcade",
    # Private Arcade frontend. Clone into apps/sandbox; path deps stay ../../
    # like a subdirectory. Not a required member so a clean makepad tree
    # still loads.
    "apps/sandbox",
    "apps/sandbox/tools/sandbox-eval",
    "libs/terminal_core",
    # standalone GPU generate service (own workspace, like diffusion)
    "libs/asset/ai",
    "libs/diffusion",
    "libs/ggml",
    # standalone CUDA FFI workspace (own [workspace] table; reached as a
    # target-specific path dep of libs/llama)
    "libs/cuda",
    "libs/voice",
    "libs/voice2",
    "libs/tts",
    "widgets/test",
    "libs/stitch",
    "libs/wasm_bridge/test",
    "libs/csg/csg",
